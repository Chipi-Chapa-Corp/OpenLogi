# Owner: config::GestureHold::DEFAULT; binding::GESTURE_HOLD_FOR_SWIPE derives it.
id: core-gesture-hold-default-owner
language: rust
severity: error
message: Derive the gesture hold default from GestureHold::DEFAULT instead of repeating 160 ms.
files:
  - crates/**/swipe.rs
rule:
  kind: call_expression
  regex: 'Duration::from_millis\(\s*160\s*\)'
  inside:
    kind: const_item
    stopBy: end
